<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Callback no clique</title>
    <!-- defer: carrega o JS e espera o HTML ser lido antes de executá-lo. -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- h1 = título principal mostrado na página. -->
    <h1>Meu primeiro evento com callback</h1>
    <!-- id identifica o botão para que o JS possa encontrá-lo. -->
    <button id="btn">Acender luz</button>
    <!-- O JavaScript vai mudar o texto deste parágrafo no clique. -->
    <p id="status">Luz apagada</p>
</body>
</html>
